<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Y2K New Tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg"></div>
  <div class="container">
    <div class="clock-wrapper">
      <div class="glitter-text" id="time">--:--:--</div>
      <div class="stars" id="stars">★ ★ ★</div>
      <div class="y2k-text">Y2K AESTHETIC</div>
    </div>
    <div class="date-wrapper" id="date">Loading...</div>
    <div class="fact-wrapper">
      <div class="y2k-fact" id="fact">Loading Y2K fact...</div>
    </div>
    <div class="guestbook">
      <h3>Guestbook</h3>
      <div id="guestbook-entries"></div>
      <form id="guestbook-form">
        <input type="text" id="guest-name" placeholder="Your name" required>
        <textarea id="guest-message" placeholder="Your message..." required></textarea>
        <button type="submit">Sign Guestbook</button>
      </form>
    </div>
    <div class="footer">
      <div class="rating">★☆☆☆☆</div>
      <div class="y2k-copy">Y2K New Tab</div>
    </div>
  </div>
  <script src="content.js"></script>
  <div id="ad-container" class="ad-banner">
    <span class="ad-label">Advertisement</span>
    <span class="ad-content">Sponsored: Try RetroWeb Browser - relive the internet of 2004!</span>
  </div>
</body>
</html>
