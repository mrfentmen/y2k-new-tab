<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Y2K New Tab store screenshot</title>
<link rel="stylesheet" href="screenshot.css">
</head>
<body>
<div class="bg"></div>
<div class="glow g1"></div>
<div class="glow g2"></div>
<div class="header">
  <div class="name">Y2K New Tab</div>
  <div class="tag">A Y2K styled start page for your new tab</div>
</div>
<div class="frame" id="frame">
  <div class="win" id="win">

      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>

      <span class="winicon" id="winicon"></span>

    <div class="winbody" id="winbody">
      <iframe id="pv" src="index.html" title="Y2K New Tab"></iframe>
    </div>
  </div>
</div>
<script src="screenshot.js"></script>

</html>
